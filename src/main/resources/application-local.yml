spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/faq-service
    username: postgres
    password: postgres
  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  data:
    mongodb:
      uri: mongodb://localhost:27017/faq_service
    redis:
      host: localhost
      port: 6379
      password:
      enabled: false
      flush-on-startup: true
  security:
    jwt:
      secret-key: k8s9f7j2m5p3q6r1t4v7x9z0b2d4g6h8j0l2n4p6r8t1v3x5z7y9w5u3a1c8e0g2i4

logging:
  config: classpath:local-logback-spring.xml

scheduler:
  defaultLockAtMostFor: "3m"
  faq-sync:
    cron: "0 */1 * * * *"
    enabled: true
    lockAtLeastFor: "1m"
    lockAtMostFor: "2m"